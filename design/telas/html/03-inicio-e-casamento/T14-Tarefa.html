<div class="lartie-frame">
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF6F3;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 12px 0 8px">

</div>
<div style="flex:1;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:16px">
<div><span style="font-size:12px;font-weight:700;color:#B3261E;background:#F9DEDC;padding:4px 8px;border-radius:8px">Atrasada 12 dias</span>
<input type="text" value="Fechar fotógrafo" aria-label="Título da tarefa" style="display:block;width:100%;box-sizing:border-box;margin-top:10px;border:0;background:none;padding:0;font:600 26px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C"></div>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Fase<select style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 12px;font:400 15px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;min-width:0"><option>Fornecedores</option><option>Decisões iniciais</option><option>Detalhes</option></select></label>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Prazo<input type="text" value="02/10/2026" style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 12px;font:400 15px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;min-width:0"></label>
</div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:600">Responsável</span>
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px"><button aria-pressed="false" style="min-height:46px;padding:0 8px;border-radius:14px;font:600 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;background:#FFFFFF;color:#2D1F1C;border:1.5px solid #CDB9B3">Ana</button><button aria-pressed="false" style="min-height:46px;padding:0 8px;border-radius:14px;font:600 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;background:#FFFFFF;color:#2D1F1C;border:1.5px solid #CDB9B3">Pedro</button><button aria-pressed="true" style="min-height:46px;padding:0 8px;border-radius:14px;font:600 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;background:#9A5A50;color:#FFFFFF;border:1.5px solid #9A5A50">Os dois</button></div></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:600">Status</span>

<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:600">Fornecedor vinculado</span>
<a href="Fornecedor.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#FFFFFF;border:1.5px solid #CDB9B3;text-decoration:none;color:#2D1F1C"><span style="width:40px;height:40px;border-radius:12px;background:#F4DED7;color:#9A5A50;display:flex;align-items:center;justify-content:center;font-weight:700">SL</span><span style="flex:1"><span style="display:block;font-weight:700;font-size:15px">Studio Luz</span><span style="font-size:13px;color:#6B5550">Negociando · R$ 7.800</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B5550" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a></div>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Notas<textarea rows="3" style="border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:12px 14px;font:400 15px/22px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;resize:none">Comparar com a Foto Mar antes de fechar. Pedir 2 fotógrafos.</textarea></label>
<label style="display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:14px;background:#FFFFFF;border:1.5px solid #CDB9B3;font-size:15px;font-weight:600">Lembrar 3 dias antes do prazo<input type="checkbox" checked="" style="width:22px;height:22px;accent-color:#9A5A50"></label>
<a href="ConfExcluirTarefa.dc.html" style="min-height:44px;display:flex;align-items:center;font-weight:700;font-size:14px;color:#B3261E;text-decoration:none;align-self:flex-start">Excluir tarefa</a>
</div>
<div style="padding:12px 20px 28px;border-top:1px solid #E6D8D3;background:#FFFFFF">
<a href="Checklist.dc.html" style="height:52px;border-radius:26px;background:#9A5A50;color:#FFFFFF;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none">Salvar</a>
</div>
</div>
