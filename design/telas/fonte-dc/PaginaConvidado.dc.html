<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Página pública de presentes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#9A5A50}a:hover{color:#7E463E}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;display:flex;flex-direction:column;overflow:hidden">
<div style="flex:1;overflow-y:auto;display:flex;flex-direction:column">
<div style="background:#9A5A50;color:#FFFFFF;padding:36px 24px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px">
<div style="display:flex"><div style="width:56px;height:56px;border-radius:28px;background:#FFFFFF;color:#9A5A50;display:flex;align-items:center;justify-content:center;font:600 22px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;border:3px solid #9A5A50">A</div><div style="width:56px;height:56px;border-radius:28px;background:#DCE9E2;color:#2F5A49;display:flex;align-items:center;justify-content:center;font:600 22px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;margin-left:-14px;border:3px solid #9A5A50">P</div></div>
<div style="font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#DCE9E2;margin-top:6px">Chá de panela</div>
<h1 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;font-weight:700;font-size:32px">Ana &amp; Pedro</h1>
<div style="font-size:14px;color:#F4DED7">12 de novembro de 2026</div>
<p style="margin:8px 0 0;font-size:15px;line-height:22px;color:#F4DED7;max-width:300px">Estamos montando nosso primeiro lar. Escolha um presente abaixo e reserve para não repetir.</p>
</div>
<div style="padding:18px 20px 8px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><h2 style="margin:0;font-size:17px">Ainda faltam 15 presentes</h2></div>
<div style="display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px">
<sc-for list="{{rooms}}" as="f" hint-placeholder-count="4"><button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.css}}">{{f.label}}</button></sc-for>
</div>
</div>
<div style="padding:4px 20px 20px;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
<sc-for list="{{items}}" as="i" hint-placeholder-count="6">
<div style="border-radius:16px;border:1px solid #E6D8D3;overflow:hidden;display:flex;flex-direction:column">
<div style="height:96px;background:#F4E9E5;display:flex;align-items:center;justify-content:center;color:#8F7A75;font-size:12px">[foto do item]</div>
<div style="padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1">
<span style="font-weight:700;font-size:14px;line-height:19px">{{i.name}}</span>
<span style="font-size:12px;color:#6B5550">{{i.meta}}</span>
<div style="flex:1"></div>
<a href="Reservar.dc.html" style="margin-top:8px;min-height:44px;border-radius:12px;background:#9A5A50;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-decoration:none">Reservar</a>
</div>
</div>
</sc-for>
</div>
<p style="margin:0 0 24px;text-align:center;font-size:12px;color:#6B5550">Lista feita com Lartiê</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { room: 'Todos' }; }
renderVals() {
const all = [
['Pratos rasos', 'Cozinha · faltam 6', 'Cozinha'], ['Panos de prato', 'Cozinha · faltam 4', 'Cozinha'],
['Escorredor de louça', 'Cozinha · falta 1', 'Cozinha'], ['Jogo de toalhas', 'Banheiro · faltam 2', 'Banheiro'],
['Jogo de lençol casal', 'Quarto · faltam 2', 'Quarto'], ['Luminária de chão', 'Sala · falta 1', 'Sala']
];
const r = this.state.room;
const chip = (on) => 'min-height:40px;padding:0 14px;border-radius:20px;white-space:nowrap;font:600 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;' + (on ? 'background:#2D1F1C;color:#FFFFFF;border:1.5px solid #2D1F1C' : 'background:#FFFFFF;color:#2D1F1C;border:1.5px solid #CDB9B3');
return {
rooms: ['Todos', 'Cozinha', 'Quarto', 'Banheiro', 'Sala'].map((l) => ({ label: l, on: String(l === r), css: chip(l === r), pick: () => this.setState({ room: l }) })),
items: all.filter((i) => r === 'Todos' || i[2] === r).map((i) => ({ name: i[0], meta: i[1] }))
};
}
}
</script>
</body>
</html>
