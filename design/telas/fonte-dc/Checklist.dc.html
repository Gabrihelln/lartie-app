<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Casamento: checklist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#9A5A50}a:hover{color:#7E463E}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF6F3;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;display:flex;flex-direction:column;position:relative;overflow:hidden">
<div style="padding:16px 20px 0">
<div style="display:flex;align-items:center;justify-content:space-between"><h1 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;font-weight:700;font-size:28px">Casamento</h1>
<a href="Tarefa.dc.html" aria-label="Adicionar tarefa" style="width:44px;height:44px;border-radius:22px;background:#9A5A50;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a></div>
<nav aria-label="Seções do casamento" style="display:flex;gap:4px;margin-top:12px;padding:4px;border-radius:14px;background:#F4E9E5">
<a href="Checklist.dc.html" aria-current="page" style="flex:1;min-height:40px;border-radius:10px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#2D1F1C;text-decoration:none">Checklist</a>
<a href="Orcamento.dc.html" style="flex:1;min-height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#6B5550;text-decoration:none">Orçamento</a>
<a href="Fornecedores.dc.html" style="flex:1;min-height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#6B5550;text-decoration:none">Fornec.</a>
<a href="Convidados.dc.html" style="flex:1;min-height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#6B5550;text-decoration:none">Convidados</a>
</nav>
</div>

<a href="Assistente.dc.html" aria-label="Abrir assistente" style="position:absolute;right:20px;bottom:100px;width:56px;height:56px;border-radius:28px;background:#9A5A50;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(90,42,35,.28)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"></path></svg></a>
<div style="flex: 1; overflow-y: auto; padding: 14px 20px 96px; display: flex; flex-direction: column; gap: 14px; height: 502px; width: 349px">
<div style="flex-shrink:0;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:#FFFFFF;border:1px solid #E6D8D3">
<div style="flex:1"><div style="font-size:13px;color:#6B5550">Progresso geral</div><div style="font-weight:700;font-size:16px;margin:2px 0 8px">{{doneCount}} de {{total}} tarefas</div><div style="height:8px;border-radius:4px;background:#F4DED7"><div style="{{bar}}"></div></div></div>
<span style="font:600 28px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#9A5A50">{{pct}}%</span></div>
<div style="flex-shrink:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.css}}">{{f.label}}</button></sc-for>
</div>
<sc-for list="{{phases}}" as="ph" hint-placeholder-count="3">
<section style="flex-shrink:0;border-radius:18px;background:#FFFFFF;border:1px solid #E6D8D3;overflow:hidden">
<div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #F1E6E2"><div style="flex:1"><div style="font-weight:700;font-size:15px">{{ph.name}}</div><div style="font-size:12px;color:#6B5550">{{ph.when}}</div></div><span style="font-size:13px;font-weight:700;color:#9A5A50">{{ph.count}}</span></div>
<sc-for list="{{ph.tasks}}" as="t" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:4px;padding:2px 12px 2px 6px;border-bottom:1px solid #F5ECE9">
<button onClick="{{t.toggle}}" aria-label="Marcar {{t.name}}" aria-pressed="{{t.on}}" style="width:44px;height:44px;flex:none;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="{{t.box}}"><sc-if value="{{t.done}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></span></button>
<a href="Tarefa.dc.html" style="{{t.label}}">{{t.name}}</a>
<span style="{{t.tag}}">{{t.meta}}</span>
</div>
</sc-for>
</section>
</sc-for>
</div><nav aria-label="Menu principal" style="display: flex; justify-content: space-around; padding: 8px 6px 22px; background: #FFFFFF; border-top: 1px solid #E6D8D3; height: 52px">
<a href="Inicio.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Início</a>
<a href="Checklist.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:700;color:#9A5A50"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="14" r="6"></circle><circle cx="15" cy="14" r="6"></circle><path d="M10 4h4l-2 3z" stroke-linejoin="round"></path></svg>Casamento</a>
<a href="Casa.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"></path><path d="M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z"></path><path d="M5 18v2M19 18v2"></path></svg>Casa</a>
<a href="Presentes.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M5 12v9h14v-9M12 8v13M12 8C10 4 6 4 7 7c.5 1 2.5 1 5 1zm0 0c2-4 6-4 5-1-.5 1-2.5 1-5 1z"></path></svg>Presentes</a>
<a href="Perfil.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){
super(p);
this.state = { filter: 'Todas', done: { 1: true, 2: true, 3: true, 4: true, 6: true } };
this.data = [
{ name: 'Decisões iniciais', when: '12 meses antes', tasks: [
{ id: 1, n: 'Definir orçamento total', m: 'Ana' }, { id: 2, n: 'Escolher data e estilo', m: 'Os dois' },
{ id: 3, n: 'Fechar local da festa', m: 'Pedro' }, { id: 4, n: 'Lista inicial de convidados', m: 'Os dois' } ] },
{ name: 'Fornecedores principais', when: '10 a 8 meses antes', tasks: [
{ id: 5, n: 'Fechar fotógrafo', m: 'Atrasada', late: true }, { id: 6, n: 'Fechar buffet', m: 'Pedro' },
{ id: 7, n: 'Degustação do buffet', m: '22 out' }, { id: 8, n: 'Contratar banda ou DJ', m: '30 nov' } ] },
{ name: 'Detalhes', when: '7 a 4 meses antes', tasks: [
{ id: 9, n: 'Definir padrinhos', m: '05 nov' }, { id: 10, n: 'Vestido e traje', m: 'dez' },
{ id: 11, n: 'Publicar lista de presentes', m: 'dez' } ] },
{ name: 'Documentos e reta final', when: '3 a 1 mês antes', tasks: [
{ id: 12, n: 'Habilitação no cartório', m: 'jan' }, { id: 13, n: 'Confirmar convidados', m: 'mar' } ] }
];
}
renderVals() {
const d = this.state.done, f = this.state.filter;
const all = [].concat(...this.data.map((p) => p.tasks));
const doneCount = all.filter((t) => d[t.id]).length + 10;
const total = 64;
const pct = Math.round(doneCount / total * 100);
const keep = (t) => f === 'Todas' || (f === 'A fazer' && !d[t.id]) || (f === 'Atrasadas' && t.late && !d[t.id]) || (f === 'Concluídas' && d[t.id]);
const chip = (on) => 'flex:none;min-height:40px;padding:0 14px;border-radius:20px;white-space:nowrap;font:600 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;' + (on ? 'background:#2D1F1C;color:#FFFFFF;border:1.5px solid #2D1F1C' : 'background:#FFFFFF;color:#2D1F1C;border:1.5px solid #CDB9B3');
return {
doneCount, total, pct, bar: 'width:' + pct + '%;height:100%;border-radius:4px;background:#9A5A50',
filters: ['Todas', 'A fazer', 'Atrasadas', 'Concluídas'].map((l) => ({ label: l, on: String(l === f), css: chip(l === f), pick: () => this.setState({ filter: l }) })),
phases: this.data.map((p) => ({ name: p.name, when: p.when,
count: p.tasks.filter((t) => d[t.id]).length + '/' + p.tasks.length,
tasks: p.tasks.filter(keep).map((t) => ({ name: t.n, meta: d[t.id] ? 'Feita' : t.m, done: !!d[t.id], on: String(!!d[t.id]),
box: 'width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;' + (d[t.id] ? 'background:#9A5A50;border:1.5px solid #9A5A50' : 'border:1.5px solid #8F7A75'),
label: 'flex:1;min-height:44px;display:flex;align-items:center;font-size:15px;font-weight:600;text-decoration:none;' + (d[t.id] ? 'color:#6B5550;text-decoration-line:line-through' : 'color:#2D1F1C'),
tag: 'font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;' + (t.late && !d[t.id] ? 'color:#B3261E;background:#F9DEDC' : 'color:#6B5550'),
toggle: () => this.setState({ done: Object.assign({}, d, { [t.id]: !d[t.id] }) }) })) }))
};
}
}
</script>
</body>
</html>
