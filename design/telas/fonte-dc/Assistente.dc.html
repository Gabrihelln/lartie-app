<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Assistente de IA</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#9A5A50}a:hover{color:#7E463E}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF6F3;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;gap:10px;padding:12px 16px 12px 8px;background:#FFFFFF;border-bottom:1px solid #E6D8D3">
<a href="Inicio.dc.html" aria-label="Voltar" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#2D1F1C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="width:40px;height:40px;border-radius:20px;background:#9A5A50;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></div>
<div><div style="font-weight:700;font-size:16px">Lu</div><div style="font-size:12px;color:#6B5550">Assistente · conversa compartilhada com Pedro</div></div>
</div>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
<div style="{{m.wrap}}"><div style="{{m.bubble}}">{{m.text}}</div></div>
<sc-if value="{{m.card}}" hint-placeholder-val="{{ false }}">
<div style="align-self:flex-start;max-width:300px;border-radius:16px;background:#FFFFFF;border:1px solid #E6D8D3;padding:14px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;color:#6B5550;text-transform:uppercase;letter-spacing:.5px">Confirmar alterações</span>
<span style="font-size:14px;line-height:21px">Studio Luz → <strong>Fechado</strong><br>Orçamento: + R$ 7.800 em Fotografia<br>6 parcelas de R$ 1.300 (out a mar)<br>Tarefa "Fechar fotógrafo" → concluída</span>
<sc-if value="{{m.pending}}" hint-placeholder-val="{{ true }}">
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px;margin-top:4px">
<button onClick="{{cancel}}" style="min-height:44px;border-radius:12px;border:1.5px solid #CDB9B3;background:#FFFFFF;font:700 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;cursor:pointer">Cancelar</button>
<button onClick="{{confirm}}" style="min-height:44px;border-radius:12px;border:0;background:#9A5A50;font:700 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#FFFFFF;cursor:pointer">Confirmar</button>
</div>
</sc-if>
</div>
</sc-if>
</sc-for>
</div>
<div style="display:flex;gap:8px;overflow-x:auto;padding:8px 16px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4"><button onClick="{{c.ask}}" style="min-height:40px;padding:0 14px;border-radius:20px;white-space:nowrap;border:1.5px solid #E6D0C9;background:#FFFFFF;font:600 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#9A5A50;cursor:pointer">{{c.label}}</button></sc-for>
</div>
<div style="display:flex;align-items:center;gap:8px;padding:8px 12px 28px;background:#FFFFFF;border-top:1px solid #E6D8D3">
<a href="FotoCadastro.dc.html" aria-label="Enviar foto" style="width:44px;height:44px;border-radius:22px;background:#F7ECE8;color:#9A5A50;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></a>
<input type="text" aria-label="Mensagem para a assistente" placeholder="Pergunte ou conte o que aconteceu" style="flex:1;min-width:0;height:44px;border-radius:22px;border:1.5px solid #CDB9B3;background:#FBF6F3;padding:0 16px;font:400 15px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif">
<button aria-label="Enviar" style="width:44px;height:44px;border-radius:22px;border:0;background:#9A5A50;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){
super(p);
this.state = { status: 'pending', extra: [] };
}
renderVals() {
const s = this.state;
const me = (t) => ({ text: t, mine: true });
const lu = (t) => ({ text: t, mine: false });
const base = [
lu('Oi, Ana! Faltam 186 dias. A tarefa "Fechar fotógrafo" está atrasada. Quer ajuda com ela?'),
me('Fechamos o Studio Luz por 7.800 em 6x'),
Object.assign(lu('Que ótimo! Posso registrar assim:'), { card: true })
];
if (s.status === 'done') base.push(lu('Pronto, tudo registrado. Vou lembrar vocês 3 dias antes de cada parcela.'));
if (s.status === 'cancel') base.push(lu('Tudo bem, não alterei nada.'));
const all = base.concat(s.extra);
const qa = {
'O que falta pra cozinha?': 'Na cozinha faltam 34 itens. Da fase "Primeira noite": geladeira, pratos rasos e panos de prato. Quer que eu coloque na lista de presentes?',
'Quem não confirmou?': '86 pessoas em 21 grupos ainda não responderam, como Amigos da faculdade e Carla e Diego. Posso reenviar o lembrete pelo WhatsApp?',
'Quanto já gastamos?': 'No casamento, R$ 21.400 de R$ 60.000 (36%). Roupas e beleza passou R$ 800 do planejado.',
'O rack de 1,80 m cabe na sala?': 'Cabe. A parede da TV tem 3,10 m livres, então sobram 1,30 m.'
};
return {
msgs: all.map((m) => ({ text: m.text, card: !!m.card, pending: s.status === 'pending',
wrap: 'display:flex;justify-content:' + (m.mine ? 'flex-end' : 'flex-start'),
bubble: 'max-width:280px;padding:10px 14px;font-size:15px;line-height:21px;border-radius:' + (m.mine ? '18px 18px 4px 18px;background:#9A5A50;color:#FFFFFF' : '18px 18px 18px 4px;background:#FFFFFF;color:#2D1F1C;border:1px solid #E6D8D3') })),
confirm: () => this.setState({ status: 'done' }), cancel: () => this.setState({ status: 'cancel' }),
chips: Object.keys(qa).map((q) => ({ label: q, ask: () => this.setState({ extra: s.extra.concat([me(q), lu(qa[q])]) }) }))
};
}
}
</script>
</body>
</html>
