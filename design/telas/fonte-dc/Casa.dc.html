<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Casa nova: cômodos</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#9A5A50}a:hover{color:#7E463E}[style*="overflow-y:auto"]>*{flex-shrink:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF6F3;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;display:flex;flex-direction:column;position:relative;overflow:hidden">
<div style="flex:1;overflow-y:auto;padding:16px 20px 96px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;justify-content:space-between"><h1 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;font-weight:700;font-size:28px">Casa nova</h1>
<div style="display:flex;gap:8px">
<a href="FotoCadastro.dc.html" aria-label="Cadastrar item por foto" style="width:44px;height:44px;border-radius:22px;background:#FFFFFF;border:1px solid #E6D8D3;color:#2D1F1C;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></a>
<a href="Item.dc.html" aria-label="Adicionar item" style="width:44px;height:44px;border-radius:22px;background:#9A5A50;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
</div></div>
<div style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:#4F7564;color:#FFFFFF">
<div style="flex:1"><div style="font-size:13px;color:#DCE9E2">Apê de 2 quartos · mudança em maio/2027</div><div style="font-weight:700;font-size:17px;margin:4px 0 10px">56 de 182 itens</div><div style="height:8px;border-radius:4px;background:#6F927F"><div style="width:31%;height:100%;border-radius:4px;background:#FFFFFF"></div></div></div>
<span style="font:600 32px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif">31%</span></div>
<div style="display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px">
<sc-for list="{{phases}}" as="f" hint-placeholder-count="4"><button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.css}}">{{f.label}}</button></sc-for>
</div>
<p style="margin:-4px 0 0;font-size:13px;color:#6B5550">{{hint}}</p>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
<sc-for list="{{rooms}}" as="r" hint-placeholder-count="7">
<a href="Comodo.dc.html" style="padding:14px;border-radius:18px;background:#FFFFFF;border:1px solid #E6D8D3;text-decoration:none;color:#2D1F1C;display:flex;flex-direction:column;gap:8px">
<span style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:700;font-size:15px">{{r.name}}</span><sc-if value="{{r.full}}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:700;color:#2F6B4F;background:#DDEFE5;padding:3px 7px;border-radius:7px">Completo</span></sc-if></span>
<span style="font-size:13px;color:#6B5550">{{r.count}}</span>
<span style="height:6px;border-radius:3px;background:#F1E6E2;display:block"><span style="{{r.bar}}"></span></span>
</a>
</sc-for>
<a href="Item.dc.html" style="padding:14px;border-radius:18px;border:1.5px dashed #D9C7C1;text-decoration:none;color:#6B5550;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;min-height:86px">+ Novo cômodo</a>
</div>
</div>
<a href="Assistente.dc.html" aria-label="Abrir assistente" style="position:absolute;right:20px;bottom:100px;width:56px;height:56px;border-radius:28px;background:#9A5A50;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(90,42,35,.28)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></svg></a>
<nav aria-label="Menu principal" style="display:flex;justify-content:space-around;padding:8px 6px 22px;background:#FFFFFF;border-top:1px solid #E6D8D3">
<a href="Inicio.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
<a href="Checklist.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="14" r="6"/><circle cx="15" cy="14" r="6"/><path d="M10 4h4l-2 3z" stroke-linejoin="round"/></svg>Casamento</a>
<a href="Casa.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:700;color:#9A5A50"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z"/><path d="M5 18v2M19 18v2"/></svg>Casa</a>
<a href="Presentes.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8C10 4 6 4 7 7c.5 1 2.5 1 5 1zm0 0c2-4 6-4 5-1-.5 1-2.5 1-5 1z"/></svg>Presentes</a>
<a href="Perfil.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { phase: 'Todas' }; }
renderVals() {
const ph = this.state.phase;
const data = {
'Todas': [['Cozinha', 18, 52], ['Quarto', 14, 30], ['Banheiro', 9, 22], ['Sala', 4, 18], ['Lavanderia', 6, 20], ['Limpeza e organização', 3, 26], ['Pets', 2, 14]],
'Primeira noite': [['Cozinha', 8, 10], ['Quarto', 6, 6], ['Banheiro', 5, 7], ['Sala', 0, 1], ['Lavanderia', 2, 4], ['Limpeza e organização', 1, 5], ['Pets', 2, 3]],
'Primeiro mês': [['Cozinha', 8, 28], ['Quarto', 6, 14], ['Banheiro', 3, 10], ['Sala', 2, 9], ['Lavanderia', 3, 10], ['Limpeza e organização', 2, 15], ['Pets', 0, 7]],
'Com calma': [['Cozinha', 2, 14], ['Quarto', 2, 10], ['Banheiro', 1, 5], ['Sala', 2, 8], ['Lavanderia', 1, 6], ['Limpeza e organização', 0, 6], ['Pets', 0, 4]]
};
const hints = { 'Todas': 'Todos os itens, de todas as fases.', 'Primeira noite': 'O mínimo para dormir na casa nova.', 'Primeiro mês': 'O restante do uso diário.', 'Com calma': 'Decoração e itens de desejo.' };
const chip = (on) => 'min-height:40px;padding:0 14px;border-radius:20px;white-space:nowrap;font:600 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;' + (on ? 'background:#2D1F1C;color:#FFFFFF;border:1.5px solid #2D1F1C' : 'background:#FFFFFF;color:#2D1F1C;border:1.5px solid #CDB9B3');
return {
phases: ['Todas', 'Primeira noite', 'Primeiro mês', 'Com calma'].map((l) => ({ label: l, on: String(l === ph), css: chip(l === ph), pick: () => this.setState({ phase: l }) })),
hint: hints[ph],
rooms: data[ph].map((r) => ({ name: r[0], count: r[1] + ' de ' + r[2] + ' itens', full: r[1] === r[2],
bar: 'display:block;width:' + Math.round(r[1] / r[2] * 100) + '%;height:100%;border-radius:3px;background:' + (r[1] === r[2] ? '#2F6B4F' : '#4F7564') }))
};
}
}
</script>
</body>
</html>
