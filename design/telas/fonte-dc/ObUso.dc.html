abel="Modo do app" style="display:flex;flex-direction:column;gap:10px"><sc-for list="{{opts}}" as="o" hint-placeholder-count="4"><button role="radio" onClick="{{o.pick}}" aria-checked="{{o.on}}" style="{{o.css}}"><span style="{{o.iconCss}}"><sc-if value="{{o.isRing}}" hint-placeholder-val="{{ true }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="13.5" r="5.5"/><circle cx="15" cy="13.5" r="5.5"/><path d="M10.5 4.5h3L12 6.8z" stroke-linejoin="round"/></svg></sc-if><sc-if value="{{o.isHome}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg></sc-if><sc-if value="{{o.isBoth}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7.5l5-4 5 4"/><circle cx="9.5" cy="15" r="4.6"/><circle cx="14.5" cy="15" r="4.6"/></svg></sc-if><sc-if value="{{o.isLater}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></sc-if></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:16px;font-weight:700">{{o.title}}</span><sc-if value="{{o.badge}}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:700;color:#5A2A23;background:#F4DED7;padding:3px 8px;border-radius:8px">{{o.badge}}</span></sc-if></span><span style="font-size:13px;line-height:18px;color:#6B5550;font-weight:400">{{o.desc}}</span></span><span style="{{o.radio}}"><sc-if value="{{o.checked}}" hint-placeholder-val="{{ false }}"><span style="width:10px;height:10px;border-radius:5px;background:#FFFFFF"></span></sc-if></span></button></sc-for></div><div style="display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid #E6D8D3;font-size:13px;line-height:18px;color:#6B5550"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F7564" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9v-5z"/><path d="M9 12l2 2 4-4"/></svg><span>Dá para mudar quando quiserem em <b style="color:#2D1F1C">Perfil › Modo do app</b>. Nada do que vocês cadastrarem é apagado.</span></div><div style="flex:1"></div><a href="{{next}}" style="height:52px;border-radius:26px;background:#9A5A50;color:#FFFFFF;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none">Continuar</a><a href="InicioDepois.dc.html" style="margin-top:8px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;text-decoration:none">Decidir depois</a></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { sel: 'dois' }; }
renderVals() {
const OPTS = [
{ id: 'casamento', title: 'Só o casamento', desc: 'Checklist, orçamento, fornecedores, convidados e lista de presentes.', fg: '#9A5A50', bg: '#F4DED7', icon: 'Ring' },
{ id: 'casa', title: 'Só a casa nova', desc: 'Enxoval por cômodo, medidas, cadastro por foto e lista de presentes.', fg: '#4F7564', bg: '#DCE9E2', icon: 'Home' },
{ id: 'dois', title: 'Casamento e casa nova', desc: 'Tudo junto, com o progresso dos dois na tela inicial.', fg: '#5A2A23', bg: '#F4DED7', icon: 'Both', badge: 'Mais completo' }
];
const optVals = (sel, pick, compact) => OPTS.map((o) => {
const on = o.id === sel;
return { title: o.title, desc: o.desc, badge: o.badge || false, checked: on, on: String(on),
isRing: o.icon === 'Ring', isHome: o.icon === 'Home', isBoth: o.icon === 'Both', isLater: o.icon === 'Later',
css: 'display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;color:#2D1F1C;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;border-radius:18px;padding:' + (compact ? '12px 14px' : '14px 16px') + ';background:#FFFFFF;' + (on ? 'border:2px solid #9A5A50;box-shadow:0 6px 16px rgba(90,42,35,.12)' : 'border:2px solid #E6D8D3'),
iconCss: 'flex:none;width:46px;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;background:' + o.bg + ';color:' + o.fg,
radio: 'flex:none;width:24px;height:24px;border-radius:12px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;' + (on ? 'background:#9A5A50;border:2px solid #9A5A50' : 'background:#FFFFFF;border:2px solid #8F7A75'),
pick: () => pick(o.id) };
});
return { opts: optVals(this.state.sel, (id) => this.setState({ sel: id }), true), next: this.state.sel === 'casa' ? 'Ob3Casa.dc.html' : 'Ob2Casamento.dc.html' };
}
}
</script>
