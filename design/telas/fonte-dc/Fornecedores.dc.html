<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fornecedores</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#9A5A50}a:hover{color:#7E463E}[style*="overflow-y:auto"]>*{flex-shrink:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF6F3;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;display:flex;flex-direction:column;position:relative;overflow:hidden">
<div style="padding:16px 20px 0">
<div style="display:flex;align-items:center;justify-content:space-between"><h1 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;font-weight:700;font-size:28px">Casamento</h1>
<a href="Fornecedor.dc.html" aria-label="Adicionar fornecedor" style="width:44px;height:44px;border-radius:22px;background:#9A5A50;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a></div>
<nav aria-label="Seções do casamento" style="display:flex;gap:4px;margin-top:12px;padding:4px;border-radius:14px;background:#F4E9E5">
<a href="Checklist.dc.html" style="flex:1;min-height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#6B5550;text-decoration:none">Checklist</a>
<a href="Orcamento.dc.html" style="flex:1;min-height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#6B5550;text-decoration:none">Orçamento</a>
<a href="Fornecedores.dc.html" aria-current="page" style="flex:1;min-height:40px;border-radius:10px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#2D1F1C;text-decoration:none">Fornec.</a>
<a href="Convidados.dc.html" style="flex:1;min-height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#6B5550;text-decoration:none">Convidados</a>
</nav>
</div>
<div style="flex:1;overflow-y:auto;padding:14px 20px 96px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px">
<sc-for list="{{cats}}" as="f" hint-placeholder-count="5"><button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.css}}">{{f.label}}</button></sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px;text-align:center">
<div style="padding:10px;border-radius:14px;background:#FFFFFF;border:1px solid #E6D8D3"><div style="font:600 20px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif">4</div><div style="font-size:12px;color:#6B5550">fechados</div></div>
<div style="padding:10px;border-radius:14px;background:#FFFFFF;border:1px solid #E6D8D3"><div style="font:600 20px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif">3</div><div style="font-size:12px;color:#6B5550">negociando</div></div>
<div style="padding:10px;border-radius:14px;background:#FFFFFF;border:1px solid #E6D8D3"><div style="font:600 20px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif">5</div><div style="font-size:12px;color:#6B5550">pesquisando</div></div>
</div>
<sc-for list="{{list}}" as="v" hint-placeholder-count="5">
<a href="Fornecedor.dc.html" style="display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:#FFFFFF;border:1px solid #E6D8D3;text-decoration:none;color:#2D1F1C">
<span style="width:46px;height:46px;flex:none;border-radius:14px;background:#F4DED7;color:#9A5A50;display:flex;align-items:center;justify-content:center;font-weight:700">{{v.ini}}</span>
<span style="flex:1;min-width:0"><span style="display:block;font-weight:700;font-size:15px">{{v.name}}</span><span style="display:block;font-size:13px;color:#6B5550">{{v.cat}} · {{v.price}}</span></span>
<span style="{{v.pill}}">{{v.status}}</span>
</a>
</sc-for>
<p style="margin:4px 0 0;font-size:13px;color:#6B5550;text-align:center">Toque em dois orçamentos da mesma categoria para comparar lado a lado.</p>
</div>
<nav aria-label="Menu principal" style="display:flex;justify-content:space-around;padding:8px 6px 22px;background:#FFFFFF;border-top:1px solid #E6D8D3">
<a href="Inicio.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
<a href="Checklist.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:700;color:#9A5A50"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="14" r="6"/><circle cx="15" cy="14" r="6"/><path d="M10 4h4l-2 3z" stroke-linejoin="round"/></svg>Casamento</a>
<a href="Casa.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z"/><path d="M5 18v2M19 18v2"/></svg>Casa</a>
<a href="Presentes.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8C10 4 6 4 7 7c.5 1 2.5 1 5 1zm0 0c2-4 6-4 5-1-.5 1-2.5 1-5 1z"/></svg>Presentes</a>
<a href="Perfil.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { cat: 'Todos' }; }
renderVals() {
const all = [
['EJ', 'Espaço Jardim', 'Local e buffet', 'R$ 18.000', 'Fechado'],
['SL', 'Studio Luz', 'Fotografia', 'R$ 7.800', 'Negociando'],
['FM', 'Foto Mar', 'Fotografia', 'R$ 6.900', 'Orçamento pedido'],
['FL', 'Flor de Lis Decor', 'Decoração', 'R$ 5.000', 'Fechado'],
['DJ', 'DJ Rafa Som', 'Música', 'R$ 3.000', 'Fechado'],
['AV', 'Ateliê Vera', 'Roupas', 'R$ 4.500', 'Fechado'],
['DS', 'Doces da Sil', 'Buffet', '[valor]', 'Pesquisando']
];
const pills = { 'Fechado': 'color:#2F6B4F;background:#DDEFE5', 'Negociando': 'color:#8A5A06;background:#F7E9CF', 'Orçamento pedido': 'color:#3E5A8A;background:#E2E7F3', 'Pesquisando': 'color:#6B5550;background:#F1E6E2' };
const c = this.state.cat;
const chip = (on) => 'min-height:40px;padding:0 14px;border-radius:20px;white-space:nowrap;font:600 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;' + (on ? 'background:#2D1F1C;color:#FFFFFF;border:1.5px solid #2D1F1C' : 'background:#FFFFFF;color:#2D1F1C;border:1.5px solid #CDB9B3');
return {
cats: ['Todos', 'Fotografia', 'Local e buffet', 'Decoração', 'Música', 'Roupas'].map((l) => ({ label: l, on: String(l === c), css: chip(l === c), pick: () => this.setState({ cat: l }) })),
list: all.filter((v) => c === 'Todos' || v[2] === c).map((v) => ({ ini: v[0], name: v[1], cat: v[2], price: v[3], status: v[4], pill: 'flex:none;font-size:12px;font-weight:700;padding:5px 9px;border-radius:9px;' + pills[v[4]] }))
};
}
}
</script>
</body>
</html>
