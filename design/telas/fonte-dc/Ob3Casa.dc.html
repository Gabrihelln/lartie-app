</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { tipo: 'Apartamento', posse: 'Alugado', mob: 'Não', quartos: 2, banheiros: 1 }; }
renderVals() {
const css = (on) => 'min-height:46px;padding:0 10px;border-radius:14px;font:600 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;' + (on ? 'background:#9A5A50;color:#FFFFFF;border:1.5px solid #9A5A50' : 'background:#FFFFFF;color:#2D1F1C;border:1.5px solid #CDB9B3');
const group = (key, opts) => opts.map((l) => ({ label: l, on: String(this.state[key] === l), css: css(this.state[key] === l), pick: () => this.setState({ [key]: l }) }));
const counter = (key, label) => ({ label, v: this.state[key], minus: () => this.setState({ [key]: Math.max(1, this.state[key] - 1) }), plus: () => this.setState({ [key]: this.state[key] + 1 }) });
return {
tipo: group('tipo', ['Apartamento', 'Casa']),
posse: group('posse', ['Alugado', 'Próprio']),
mob: group('mob', ['Sim', 'Em parte', 'Não']),
counters: [counter('quartos', 'Quartos'), counter('banheiros', 'Banheiros')]
};
}
}
</script>
