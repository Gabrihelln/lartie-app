<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Esqueci a senha</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#9A5A50}a:hover{color:#7E463E}</style>
</helmet>
<div style="position:relative;isolation:isolate;overflow:hidden;width:390px;height:844px;box-sizing:border-box;background:#FBF6F3;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;display:flex;flex-direction:column;padding:16px 24px 32px">
<div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:470px;background:linear-gradient(170deg,#EDC9BF 0%,#F4DED7 55%,#FBF6F3 100%);z-index:-1"></div><svg width="420" height="420" viewBox="0 0 420 420" fill="none" aria-hidden="true" style="position:absolute;right:-150px;top:-120px;z-index:-1"><circle cx="170" cy="210" r="140" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="18"/><circle cx="250" cy="210" r="140" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="18"/></svg>
<a href="Entrar.dc.html" aria-label="Voltar" style="width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center;color:#2D1F1C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<sc-if value="{{form}}" hint-placeholder-val="{{ true }}">
<h1 style="margin:12px 0 6px;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;font-weight:700;font-size:30px">Esqueceu a senha?</h1>
<p style="margin:0 0 24px;font-size:15px;line-height:22px;color:#6B5550">Informe o e-mail da conta. Vamos enviar um link para criar uma nova senha.</p>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">E-mail<input type="email" placeholder="ana@email.com" style="height:52px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 16px;font:400 16px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif"></label>
<div style="flex:1"></div>
<button onClick="{{send}}" style="height:52px;border-radius:26px;border:0;background:#9A5A50;color:#FFFFFF;font:700 16px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer">Enviar link</button>
</sc-if>
<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px">
<div style="width:72px;height:72px;border-radius:36px;background:#F4DED7;display:flex;align-items:center;justify-content:center;color:#9A5A50"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>
<h1 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;font-weight:700;font-size:26px">Confira seu e-mail</h1>
<p style="margin:0;font-size:15px;line-height:22px;color:#6B5550;max-width:300px">Enviamos o link para ana@email.com. Ele vale por 1 hora.</p>
<button onClick="{{back}}" style="min-height:44px;border:0;background:none;font:700 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#9A5A50;cursor:pointer">Reenviar e-mail</button>
</div>
<a href="Entrar.dc.html" style="height:52px;border-radius:26px;background:#9A5A50;color:#FFFFFF;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none">Voltar para o login</a>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { sent: false }; }
renderVals() {
return { form: !this.state.sent, sent: this.state.sent,
send: () => this.setState({ sent: true }), back: () => this.setState({ sent: false }) };
}
}
</script>
</body>
</html>
