<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lista: itens e reservas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#9A5A50}a:hover{color:#7E463E}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF6F3;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 12px 0 8px">
<a href="Presentes.dc.html" aria-label="Voltar" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#2D1F1C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<a href="PaginaConvidado.dc.html" style="min-height:44px;padding:0 10px;display:flex;align-items:center;font-size:14px;font-weight:700;text-decoration:none">Ver como convidado</a>
</div>
<div style="padding:0 20px;display:flex;flex-direction:column;gap:12px">
<div><h1 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;font-weight:700;font-size:28px">Chá de panela</h1><div style="font-size:14px;color:#6B5550">12 de novembro de 2026 · 9 de 24 reservados</div></div>
<div style="display:flex;gap:8px">
<a href="SheetCompartilhar.dc.html" style="flex:1;min-height:46px;border-radius:14px;background:#1F7A4D;color:#FFFFFF;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;text-decoration:none">Compartilhar</a>
<button style="flex:1;min-height:46px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;color:#2D1F1C;font:700 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer">Copiar link</button>
</div>
<label style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#FFFFFF;border:1px solid #E6D8D3;font-size:14px"><span style="flex:1"><strong>Modo surpresa</strong><br><span style="color:#6B5550;font-size:13px">Esconde quem reservou até o dia do chá</span></span><input type="checkbox" style="width:22px;height:22px;accent-color:#9A5A50"></label>
<div style="display:flex;gap:4px;padding:4px;border-radius:14px;background:#F4E9E5">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.css}}">{{t.label}}</button></sc-for>
</div>
</div>
<div style="flex:1;overflow-y:auto;padding:12px 20px 20px;display:flex;flex-direction:column;gap:8px">
<sc-for list="{{items}}" as="i" hint-placeholder-count="6">
<div style="display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-radius:16px;background:#FFFFFF;border:1px solid #E6D8D3">
<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15px">{{i.name}}</div><div style="font-size:13px;color:#6B5550">{{i.meta}}</div></div>
<sc-if value="{{i.canReceive}}" hint-placeholder-val="{{ false }}"><button onClick="{{i.receive}}" style="min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid #9A5A50;background:#FFFFFF;color:#9A5A50;font:700 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer">Recebido</button></sc-if>
<sc-if value="{{i.isDone}}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:700;color:#2F6B4F;background:#DDEFE5;padding:5px 9px;border-radius:9px">Recebido</span></sc-if>
</div>
</sc-for>
</div>
<div style="padding:12px 20px 28px;border-top:1px solid #E6D8D3;background:#FFFFFF">
<a href="Casa.dc.html" style="height:52px;border-radius:26px;background:#9A5A50;color:#FFFFFF;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none">+ Adicionar itens do enxoval</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){
super(p);
this.state = { tab: 'Todos', st: { 1: 'res', 2: 'res', 3: 'free', 4: 'got', 5: 'res', 6: 'free', 7: 'free' } };
this.items = [
[1, 'Jogo de panelas', 'Tia Bia', '1 unidade'], [2, 'Air fryer', 'Carla e Diego', '1 unidade'], [3, 'Pratos rasos', '', '0 de 6 reservados'],
[4, 'Liquidificador', 'Vó Lúcia', '1 unidade'], [5, 'Faqueiro 24 peças', 'Madrinha Rosa', '1 unidade'], [6, 'Panos de prato', '', '2 de 6 reservados'], [7, 'Escorredor de louça', '', 'Disponível']
];
}
renderVals() {
const st = this.state.st, tab = this.state.tab;
const css = (on) => 'flex:1;min-height:40px;border:0;border-radius:10px;font:' + (on ? '700' : '600') + ' 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;' + (on ? 'background:#FFFFFF;color:#2D1F1C' : 'background:transparent;color:#6B5550');
const keep = (s) => tab === 'Todos' || (tab === 'Reservados' && s === 'res') || (tab === 'Recebidos' && s === 'got');
return {
tabs: ['Todos', 'Reservados', 'Recebidos'].map((l) => ({ label: l, on: String(l === tab), css: css(l === tab), pick: () => this.setState({ tab: l }) })),
items: this.items.filter((i) => keep(st[i[0]])).map((i) => { const s = st[i[0]]; return {
name: i[1], meta: s === 'free' ? i[3] : (s === 'res' ? 'Reservado por ' + i[2] : 'Presente de ' + i[2]),
canReceive: s === 'res', isDone: s === 'got',
receive: () => this.setState({ st: Object.assign({}, st, { [i[0]]: 'got' }) }) }; })
};
}
}
</script>
</body>
</html>
