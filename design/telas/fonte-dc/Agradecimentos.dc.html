<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Agradecimentos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#9A5A50}a:hover{color:#7E463E}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF6F3;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;padding:12px 12px 0 8px">
<a href="Presentes.dc.html" aria-label="Voltar" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#2D1F1C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
</div>
<div style="padding:0 20px 8px">
<h1 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;font-weight:700;font-size:28px">Agradecimentos</h1>
<div style="font-size:14px;color:#6B5550;margin-top:4px">{{pending}} de {{total}} ainda sem agradecimento</div>
</div>
<div style="flex:1;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:10px">
<div style="padding:14px;border-radius:16px;background:#FFFFFF;border:1px solid #E6D8D3;display:flex;flex-direction:column;gap:8px">
<span style="font-size:13px;font-weight:700;color:#6B5550">Modelo de mensagem</span>
<p style="margin:0;font-size:14px;line-height:21px">Oi, [nome]! Muito obrigado pelo [presente]. Ele já tem lugar especial na nossa casa nova. Com carinho, Ana e Pedro.</p>
<button style="align-self:flex-start;min-height:40px;padding:0 4px;border:0;background:none;font:700 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#9A5A50;cursor:pointer">Editar modelo</button>
</div>
<sc-for list="{{people}}" as="p" hint-placeholder-count="6">
<div style="display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:16px;background:#FFFFFF;border:1px solid #E6D8D3">
<div style="width:40px;height:40px;flex:none;border-radius:20px;background:#DCE9E2;color:#2F5A49;display:flex;align-items:center;justify-content:center;font-weight:700">{{p.ini}}</div>
<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15px">{{p.name}}</div><div style="font-size:13px;color:#6B5550">{{p.gift}}</div></div>
<sc-if value="{{p.todo}}" hint-placeholder-val="{{ true }}"><button onClick="{{p.send}}" style="min-height:44px;padding:0 12px;border-radius:12px;border:0;background:#1F7A4D;color:#FFFFFF;font:700 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer">Agradecer</button></sc-if>
<sc-if value="{{p.ok}}" hint-placeholder-val="{{ false }}"><button onClick="{{p.send}}" aria-label="Desmarcar agradecimento" style="min-height:44px;padding:0 10px;border-radius:12px;border:0;background:#DDEFE5;color:#2F6B4F;font:700 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer">Agradecido</button></sc-if>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { ok: { 'Vó Lúcia': true, 'Tio Marcos': true, 'Júlia R.': true } }; }
renderVals() {
const ppl = [['Tia Bia', 'Jogo de panelas · Chá de panela'], ['Carla e Diego', 'Air fryer · Chá de panela'], ['Madrinha Rosa', 'Faqueiro 24 peças · Chá de panela'],
['Vó Lúcia', 'Liquidificador · Chá de panela'], ['Tio Marcos', 'Jogo de toalhas · entregue em casa'], ['Júlia R.', 'Luminária de chão · Casamento'], ['Fábio e Lia', 'Jogo de lençol · Casamento'], ['Turma do trabalho', 'Panos de prato · Chá de panela']];
const ok = this.state.ok;
const ini = (n) => n.split(' ').map((w) => w[0]).slice(0, 2).join('').toUpperCase();
return {
total: ppl.length, pending: ppl.filter((p) => !ok[p[0]]).length,
people: ppl.map((p) => ({ name: p[0], gift: p[1], ini: ini(p[0]), ok: !!ok[p[0]], todo: !ok[p[0]],
send: () => this.setState({ ok: Object.assign({}, ok, { [p[0]]: !ok[p[0]] }) }) }))
};
}
}
</script>
</body>
</html>
