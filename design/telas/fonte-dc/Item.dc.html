<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Item do enxoval</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#9A5A50}a:hover{color:#7E463E}input,select{min-width:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF6F3;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 12px 0 8px">
<a href="ConfDescartar.dc.html" aria-label="Voltar" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#2D1F1C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<span style="font-weight:700;font-size:16px">Item</span>
<a href="ConfExcluirItem.dc.html" style="min-height:44px;padding:0 8px;display:flex;align-items:center;font-weight:700;font-size:14px;color:#B3261E;text-decoration:none">Excluir</a>
</div>
<div style="flex:1;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:14px;align-items:center">
<a href="FotoCadastro.dc.html" aria-label="Adicionar foto" style="width:84px;height:84px;flex:none;border-radius:18px;border:1.5px dashed #D9B8AF;background:#F7ECE8;color:#9A5A50;display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></a>
<label style="flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Nome<input type="text" value="Geladeira frost free" style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 14px;font:400 16px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif"></label>
</div>
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px">
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Cômodo<select style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 8px;font:400 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif"><option>Cozinha</option><option>Sala</option></select></label>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Fase<select style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 8px;font:400 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif"><option>1ª noite</option><option>1º mês</option><option>Com calma</option></select></label>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Qtd.<input type="number" value="1" style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 12px;font:400 16px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif"></label>
</div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:600">Estado</span>
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px"><sc-for list="{{state}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="{{o.css}}">{{o.label}}</button></sc-for></div></div>
<sc-if value="{{showOrigin}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:600">Como chegou</span>
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px"><sc-for list="{{origin}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="{{o.css}}">{{o.label}}</button></sc-for></div>
<sc-if value="{{gift}}" hint-placeholder-val="{{ false }}"><input type="text" aria-label="Quem deu" placeholder="Quem deu? Ex.: Tia Bia" style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 14px;font:400 15px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif"></sc-if>
</div>
</sc-if>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Preço estimado<input type="text" value="R$ 3.200" style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 14px;font:400 15px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif"></label>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Link da loja<input type="url" placeholder="Cole o link" style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 14px;font:400 15px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif"></label>
</div>
<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600">Medidas (cm)</span>
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px">
<input type="text" value="70" aria-label="Largura" style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 12px;font:400 15px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif">
<input type="text" value="72" aria-label="Profundidade" style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 12px;font:400 15px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif">
<input type="text" value="186" aria-label="Altura" style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 12px;font:400 15px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif">
</div>
<div style="display:flex;justify-content:space-between;font-size:12px;color:#6B5550;padding:0 4px"><span>Largura</span><span>Profundidade</span><span>Altura</span></div>
<div style="display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:#DDEFE5;color:#2F6B4F;font-size:13px;font-weight:600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Cabe no espaço da geladeira (75 cm livres)</div>
</div>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Observação<input type="text" placeholder="Ex.: preferimos inox" style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 14px;font:400 15px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif"></label>
</div>
<div style="padding:12px 20px 28px;border-top:1px solid #E6D8D3;background:#FFFFFF">
<a href="Comodo.dc.html" style="height:52px;border-radius:26px;background:#9A5A50;color:#FFFFFF;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none">Salvar item</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { st: 'Falta', origin: 'Ganhado' }; }
renderVals() {
const css = (on) => 'min-height:46px;padding:0 6px;border-radius:14px;font:600 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;' + (on ? 'background:#9A5A50;color:#FFFFFF;border:1.5px solid #9A5A50' : 'background:#FFFFFF;color:#2D1F1C;border:1.5px solid #CDB9B3');
const g = (k, opts) => opts.map((l) => ({ label: l, on: String(this.state[k] === l), css: css(this.state[k] === l), pick: () => this.setState({ [k]: l }) }));
return { state: g('st', ['Falta', 'Já tenho', 'Na lista']), origin: g('origin', ['Comprado', 'Ganhado', 'Já era nosso']),
showOrigin: this.state.st === 'Já tenho', gift: this.state.origin === 'Ganhado' };
}
}
</script>
</body>
</html>
