<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Onboarding: ponto de partida</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#9A5A50}a:hover{color:#7E463E}</style>
</helmet>
<div style="position:relative;isolation:isolate;overflow:hidden;width:390px;height:844px;box-sizing:border-box;background:#FBF6F3;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;display:flex;flex-direction:column;padding:16px 24px 32px">
<div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:470px;background:linear-gradient(170deg,#EDC9BF 0%,#F4DED7 55%,#FBF6F3 100%);z-index:-1"></div><svg width="420" height="420" viewBox="0 0 420 420" fill="none" aria-hidden="true" style="position:absolute;right:-150px;top:-120px;z-index:-1"><circle cx="170" cy="210" r="140" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="18"/><circle cx="250" cy="210" r="140" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="18"/></svg>
<div style="display:flex;align-items:center;gap:12px">
<a href="Ob3Casa.dc.html" aria-label="Voltar" style="width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center;color:#2D1F1C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="flex:1;display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:6px"><div style="height:6px;border-radius:3px;background:#9A5A50"></div><div style="height:6px;border-radius:3px;background:#9A5A50"></div><div style="height:6px;border-radius:3px;background:#9A5A50"></div><div style="height:6px;border-radius:3px;background:#9A5A50"></div><div style="height:6px;border-radius:3px;background:#9A5A50"></div></div>
<span style="font-size:13px;font-weight:600;color:#6B5550">5 de 5</span>
</div>
<h1 style="margin:20px 0 6px;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;font-weight:700;font-size:28px;line-height:34px">O que vocês já têm?</h1>
<p style="margin:0 0 18px;font-size:15px;line-height:22px;color:#6B5550">O que marcar aqui entra no enxoval como "Já tenho".</p>
<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px"><span style="font-size:13px;font-weight:600">Algum de vocês já mora sozinho?</span>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px"><sc-for list="{{mora}}" as="o" hint-placeholder-count="2"><button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="{{o.css}}">{{o.label}}</button></sc-for></div></div>
<span style="font-size:13px;font-weight:600;margin-bottom:8px">Marque o que já têm</span>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px">
<sc-for list="{{itens}}" as="i" hint-placeholder-count="8"><button onClick="{{i.toggle}}" aria-pressed="{{i.on}}" style="{{i.css}}"><span style="{{i.box}}"><sc-if value="{{i.checked}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></sc-if></span>{{i.label}}</button></sc-for>
</div>
<div style="flex:1"></div>
<a href="ObGerando.dc.html" style="height:52px;border-radius:26px;background:#9A5A50;color:#FFFFFF;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none">Montar nosso plano</a>
<a href="ObGerando.dc.html" style="margin-top:8px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-decoration:none">Pular, começamos do zero</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { mora: 'Sim', have: { 'Cama e colchão': true, 'Micro-ondas': true } }; }
renderVals() {
const css = (on) => 'min-height:46px;padding:0 10px;border-radius:14px;font:600 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;' + (on ? 'background:#9A5A50;color:#FFFFFF;border:1.5px solid #9A5A50' : 'background:#FFFFFF;color:#2D1F1C;border:1.5px solid #CDB9B3');
const list = ['Cozinha montada', 'Cama e colchão', 'Geladeira', 'Fogão', 'Máquina de lavar', 'Sofá', 'Cama e banho', 'Micro-ondas'];
const h = this.state.have;
return {
mora: ['Sim', 'Não'].map((l) => ({ label: l, on: String(this.state.mora === l), css: css(this.state.mora === l), pick: () => this.setState({ mora: l }) })),
itens: list.map((l) => ({ label: l, checked: !!h[l], on: String(!!h[l]),
css: 'min-height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:14px;background:#FFFFFF;font:600 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;text-align:left;cursor:pointer;border:1.5px solid ' + (h[l] ? '#9A5A50' : '#CDB9B3'),
box: 'width:20px;height:20px;flex:none;border-radius:6px;display:flex;align-items:center;justify-content:center;' + (h[l] ? 'background:#9A5A50;border:1.5px solid #9A5A50' : 'background:#FFFFFF;border:1.5px solid #8F7A75'),
toggle: () => this.setState({ have: Object.assign({}, h, { [l]: !h[l] }) }) }))
};
}
}
</script>
</body>
</html>
