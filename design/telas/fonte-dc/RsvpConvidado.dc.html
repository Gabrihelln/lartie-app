<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Confirmação de presença</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#9A5A50}a:hover{color:#7E463E}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;display:flex;flex-direction:column;overflow:hidden">
<div style="background:#9A5A50;color:#FFFFFF;padding:28px 24px 22px;text-align:center">
<div style="font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#DCE9E2">Vocês estão convidados</div>
<h1 style="margin:6px 0 4px;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;font-weight:700;font-size:30px">Ana &amp; Pedro</h1>
<div style="font-size:14px;color:#F4DED7;line-height:21px">18 de abril de 2027, 17h<br>Espaço Jardim · Curitiba, PR</div>
</div>
<sc-if value="{{form}}" hint-placeholder-val="{{ true }}">
<div style="flex:1;overflow-y:auto;padding:18px 20px 16px;display:flex;flex-direction:column;gap:12px">
<div><h2 style="margin:0;font-size:18px">Família Souza</h2><div style="font-size:13px;color:#6B5550;margin-top:2px">Confirme até 18 de fevereiro de 2027</div></div>
<sc-for list="{{people}}" as="p" hint-placeholder-count="4">
<div style="padding:12px 14px;border-radius:16px;border:1px solid #E6D8D3;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span style="font-weight:700;font-size:15px">{{p.name}}</span>
<div style="display:flex;gap:6px"><button onClick="{{p.yes}}" aria-pressed="{{p.isYes}}" style="{{p.yesCss}}">Vou</button><button onClick="{{p.no}}" aria-pressed="{{p.isNo}}" style="{{p.noCss}}">Não vou</button></div></div>
<sc-if value="{{p.going}}" hint-placeholder-val="{{ true }}"><select aria-label="Restrição alimentar de {{p.name}}" style="height:44px;border-radius:12px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 10px;font:400 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif"><option>Sem restrição alimentar</option><option>Vegetariano</option><option>Vegano</option><option>Sem glúten</option><option>Sem lactose</option><option>Outra</option></select></sc-if>
</div>
</sc-for>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Recado para os noivos (opcional)<textarea rows="2" style="border-radius:14px;border:1.5px solid #CDB9B3;padding:12px 14px;font:400 15px/22px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;resize:none"></textarea></label>
</div>
<div style="padding:12px 20px 28px;border-top:1px solid #E6D8D3">
<button onClick="{{send}}" style="width:100%;height:52px;border-radius:26px;border:0;background:#9A5A50;color:#FFFFFF;font:700 16px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer">Enviar confirmação</button>
</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px">
<div style="width:72px;height:72px;border-radius:36px;background:#DDEFE5;color:#9A5A50;display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div>
<h2 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;font-weight:700;font-size:24px">Presença confirmada</h2>
<p style="margin:0;font-size:15px;line-height:22px;color:#6B5550">{{summary}} Você pode mudar a resposta por este mesmo link até o prazo.</p>
<a href="PaginaConvidado.dc.html" style="margin-top:8px;min-height:48px;padding:0 20px;border-radius:24px;border:1.5px solid #9A5A50;display:flex;align-items:center;font-size:15px;font-weight:700;text-decoration:none">Ver lista de presentes</a>
<button onClick="{{edit}}" style="min-height:44px;border:0;background:none;font:700 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#6B5550;cursor:pointer">Alterar resposta</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { done: false, go: { 'Marta Souza': true, 'Paulo Souza': true, 'Lucas Souza': true, 'Bia Souza': false } }; }
renderVals() {
const go = this.state.go;
const btn = (on, color) => 'min-height:40px;padding:0 12px;border-radius:10px;font:700 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;' + (on ? 'background:' + color + ';color:#FFFFFF;border:1.5px solid ' + color : 'background:#FFFFFF;color:#2D1F1C;border:1.5px solid #CDB9B3');
const names = Object.keys(go);
const yes = names.filter((n) => go[n]).length;
return {
form: !this.state.done, done: this.state.done,
summary: yes + ' de ' + names.length + ' pessoas vão.',
send: () => this.setState({ done: true }), edit: () => this.setState({ done: false }),
people: names.map((n) => ({ name: n, going: go[n], isYes: String(go[n]), isNo: String(!go[n]),
yesCss: btn(go[n], '#9A5A50'), noCss: btn(!go[n], '#B3261E'),
yes: () => this.setState({ go: Object.assign({}, go, { [n]: true }) }), no: () => this.setState({ go: Object.assign({}, go, { [n]: false }) }) }))
};
}
}
</script>
</body>
</html>
