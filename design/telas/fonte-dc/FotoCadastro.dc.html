<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cadastro por foto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#9A5A50}a:hover{color:#7E463E}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#1C1513;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#FFFFFF;display:flex;flex-direction:column;position:relative;overflow:hidden">
<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 12px 0 8px">
<a href="Casa.dc.html" aria-label="Fechar" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#FFFFFF"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
<span style="font-weight:700;font-size:16px">Cadastrar por foto</span>
<span style="font-size:13px;font-weight:700;color:#E3A79C;width:44px;text-align:right;padding-right:6px">{{count}}</span>
</div>
<div style="flex:1;margin:12px 20px;border-radius:24px;background:#3A2D2A;position:relative;display:flex;align-items:center;justify-content:center">
<div style="width:220px;height:220px;border:2px solid rgba(255,255,255,.6);border-radius:20px"></div>
<svg width="110" height="80" viewBox="0 0 110 80" fill="none" stroke="#CDB7B1" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" style="position:absolute"><path d="M10 32h90v30a10 10 0 0 1-10 10H20a10 10 0 0 1-10-10z"/><path d="M2 32h106M30 20c0-6 8-10 25-10s25 4 25 10"/></svg>
<span style="position:absolute;bottom:18px;font-size:13px;color:#CDB7B1">Enquadre o item, a nota fiscal ou o print</span>
</div>
<div style="display:flex;justify-content:center;gap:6px;margin-bottom:14px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3"><button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.css}}">{{m.label}}</button></sc-for>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 32px 36px">
<button aria-label="Escolher da galeria" style="width:48px;height:48px;border-radius:12px;border:1.5px solid #6B5550;background:#3A2D2A;cursor:pointer;color:#FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg></button>
<button onClick="{{shoot}}" aria-label="Tirar foto" style="width:76px;height:76px;border-radius:38px;border:4px solid #FFFFFF;background:#FFFFFF;box-shadow:inset 0 0 0 4px #1C1513;cursor:pointer"></button>
<label style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#CDB7B1;width:48px"><input type="checkbox" checked style="width:20px;height:20px;accent-color:#E3A79C;margin:0">Em série</label>
</div>
<sc-if value="{{result}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;right:0;bottom:0;background:#FBF6F3;color:#2D1F1C;border-radius:24px 24px 0 0;padding:20px 20px 28px;display:flex;flex-direction:column;gap:12px">
<div style="width:40px;height:4px;border-radius:2px;background:#CDB9B3;align-self:center"></div>
<div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#9A5A50"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Reconhecemos este item. Confira:</div>
<div style="border-radius:16px;background:#FFFFFF;border:1px solid #E6D8D3;padding:4px 14px">
<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F5ECE9;font-size:14px"><span style="color:#6B5550">Item</span><strong>Jogo de panelas, 5 peças</strong></div>
<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F5ECE9;font-size:14px"><span style="color:#6B5550">Cômodo</span><strong>Cozinha</strong></div>
<div style="display:flex;justify-content:space-between;padding:10px 0;font-size:14px"><span style="color:#6B5550">Cor</span><strong>Inox</strong></div>
</div>
<span style="font-size:13px;font-weight:600">Como chegou?</span>
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px"><sc-for list="{{origin}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="{{o.css}}">{{o.label}}</button></sc-for></div>
<input type="text" aria-label="Quem deu" value="Tia Bia" style="height:48px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 14px;font:400 15px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif">
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px">
<button onClick="{{retake}}" style="height:50px;border-radius:25px;border:1.5px solid #CDB9B3;background:#FFFFFF;font:700 15px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;cursor:pointer">Refazer</button>
<button onClick="{{save}}" style="height:50px;border-radius:25px;border:0;background:#9A5A50;font:700 15px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#FFFFFF;cursor:pointer">Salvar e próxima</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { mode: 'Item', shot: false, origin: 'Ganhado', saved: 0 }; }
renderVals() {
const s = this.state;
const mcss = (on) => 'min-height:40px;padding:0 14px;border-radius:20px;border:0;font:700 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;' + (on ? 'background:#FFFFFF;color:#1C1513' : 'background:transparent;color:#CDB7B1');
const css = (on) => 'min-height:44px;padding:0 6px;border-radius:12px;font:600 13px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;' + (on ? 'background:#9A5A50;color:#FFFFFF;border:1.5px solid #9A5A50' : 'background:#FFFFFF;color:#2D1F1C;border:1.5px solid #CDB9B3');
return {
count: s.saved ? s.saved + ' salvos' : '',
modes: ['Item', 'Nota fiscal', 'Print'].map((l) => ({ label: l, on: String(s.mode === l), css: mcss(s.mode === l), pick: () => this.setState({ mode: l }) })),
origin: ['Comprado', 'Ganhado', 'Já era nosso'].map((l) => ({ label: l, on: String(s.origin === l), css: css(s.origin === l), pick: () => this.setState({ origin: l }) })),
result: s.shot,
shoot: () => this.setState({ shot: true }),
retake: () => this.setState({ shot: false }),
save: () => this.setState({ shot: false, saved: s.saved + 1 })
};
}
}
</script>
</body>
</html>
