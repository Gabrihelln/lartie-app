<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Grupo de convidados</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#9A5A50}a:hover{color:#7E463E}input{min-width:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF6F3;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 12px 0 8px">
<a href="Convidados.dc.html" aria-label="Voltar" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#2D1F1C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<span style="font-weight:700;font-size:16px">Grupo de convidados</span>
<span style="width:44px"></span>
</div>
<div style="flex:1;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px">
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Nome do grupo<input type="text" value="Família Souza" style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 14px;font:400 16px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif"></label>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:600">Lado</span>
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px"><sc-for list="{{side}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="{{o.css}}">{{o.label}}</button></sc-for></div></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:600">Tipo</span>
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px"><sc-for list="{{kind}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="{{o.css}}">{{o.label}}</button></sc-for></div></div>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">WhatsApp para o convite<input type="tel" value="(41) 99812-3344" style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 14px;font:400 16px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif"></label>
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:600">Pessoas ({{n}})</span><button onClick="{{add}}" style="min-height:44px;border:0;background:none;font:700 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#9A5A50;cursor:pointer">+ Adicionar pessoa</button></div>
<sc-for list="{{people}}" as="p" hint-placeholder-count="4">
<div style="display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:14px;background:#FFFFFF;border:1px solid #E6D8D3">
<input type="text" value="{{p.name}}" aria-label="Nome da pessoa" style="flex:1;height:40px;border:0;background:none;font:600 15px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C">
<button onClick="{{p.toggle}}" style="{{p.css}}">{{p.age}}</button>
</div>
</sc-for>
<div style="padding:12px 14px;border-radius:14px;background:#F7ECE8;font-size:13px;line-height:19px;color:#2F6B4F">O grupo recebe um link próprio. Cada pessoa confirma presença e informa restrição alimentar.</div>
<button style="min-height:44px;border:0;background:none;font:700 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#B3261E;cursor:pointer;align-self:flex-start;padding:0">Excluir grupo</button>
</div>
<div style="padding:12px 20px 28px;border-top:1px solid #E6D8D3;background:#FFFFFF;display:flex;flex-direction:column;gap:8px">
<a href="RsvpConvidado.dc.html" style="height:52px;border-radius:26px;background:#1F7A4D;color:#FFFFFF;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none">Salvar e enviar convite</a>
<a href="Convidados.dc.html" style="min-height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-decoration:none">Só salvar</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { side: 'Ana', kind: 'Família', people: [['Marta Souza', 'Adulto'], ['Paulo Souza', 'Adulto'], ['Lucas Souza', 'Criança'], ['Bia Souza', 'Criança']] }; }
renderVals() {
const s = this.state;
const css = (on) => 'min-height:46px;border-radius:14px;font:600 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;' + (on ? 'background:#9A5A50;color:#FFFFFF;border:1.5px solid #9A5A50' : 'background:#FFFFFF;color:#2D1F1C;border:1.5px solid #CDB9B3');
const g = (k, opts) => opts.map((l) => ({ label: l, on: String(s[k] === l), css: css(s[k] === l), pick: () => this.setState({ [k]: l }) }));
return {
side: g('side', ['Ana', 'Pedro', 'Os dois']), kind: g('kind', ['Família', 'Amigos', 'Trabalho']), n: s.people.length,
add: () => this.setState({ people: s.people.concat([['Nova pessoa', 'Adulto']]) }),
people: s.people.map((p, i) => ({ name: p[0], age: p[1],
css: 'flex:none;min-height:40px;padding:0 12px;border-radius:10px;border:0;font:700 12px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;' + (p[1] === 'Criança' ? 'background:#F7E9CF;color:#8A5A06' : 'background:#F1E6E2;color:#2D1F1C'),
toggle: () => this.setState({ people: s.people.map((q, j) => j === i ? [q[0], q[1] === 'Adulto' ? 'Criança' : 'Adulto'] : q) }) }))
};
}
}
</script>
</body>
</html>
