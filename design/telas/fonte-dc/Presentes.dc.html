<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Presentes: listas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#9A5A50}a:hover{color:#7E463E}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF6F3;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;color:#2D1F1C;display:flex;flex-direction:column;position:relative;overflow:hidden">
<div style="flex:1;overflow-y:auto;padding:16px 20px 96px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;justify-content:space-between"><h1 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;font-weight:700;font-size:28px">Presentes</h1>
<button onClick="{{open}}" style="min-height:44px;padding:0 16px;border-radius:22px;border:0;background:#9A5A50;color:#FFFFFF;font:700 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer">+ Nova lista</button></div>
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px;text-align:center">
<div style="padding:12px 8px;border-radius:14px;background:#FFFFFF;border:1px solid #E6D8D3"><div style="font:600 22px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif">21</div><div style="font-size:12px;color:#6B5550">reservados</div></div>
<div style="padding:12px 8px;border-radius:14px;background:#FFFFFF;border:1px solid #E6D8D3"><div style="font:600 22px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif">8</div><div style="font-size:12px;color:#6B5550">recebidos</div></div>
<div style="padding:12px 8px;border-radius:14px;background:#FFFFFF;border:1px solid #E6D8D3"><div style="font:600 22px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif">49</div><div style="font-size:12px;color:#6B5550">ainda faltam</div></div>
</div>
<sc-for list="{{lists}}" as="l" hint-placeholder-count="3">
<div style="border-radius:20px;background:#FFFFFF;border:1px solid #E6D8D3;padding:16px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font:600 20px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif">{{l.name}}</div><div style="font-size:13px;color:#6B5550;margin-top:2px">{{l.date}}</div></div><span style="{{l.pill}}">{{l.status}}</span></div>
<div style="display:flex;align-items:center;gap:10px"><div style="flex:1;height:6px;border-radius:3px;background:#E2E7F3"><div style="{{l.bar}}"></div></div><span style="font-size:13px;font-weight:700">{{l.count}}</span></div>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px">
<a href="ListaPresentes.dc.html" style="min-height:44px;border-radius:12px;border:1.5px solid #CDB9B3;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-decoration:none;color:#2D1F1C">Gerenciar</a>
<a href="{{l.href}}" style="min-height:44px;border-radius:12px;background:#F7ECE8;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-decoration:none;color:#9A5A50">{{l.cta}}</a>
</div>
</div>
</sc-for>
<a href="Agradecimentos.dc.html" style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:#F4DED7;text-decoration:none;color:#5A2A23"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg><span style="flex:1;font-size:15px"><strong>Agradecimentos</strong><br><span style="font-size:13px">5 presentes ainda sem agradecimento</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
</div>
<sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:rgba(28,21,19,.45);display:flex;flex-direction:column;justify-content:flex-end">
<div style="background:#FBF6F3;border-radius:24px 24px 0 0;padding:20px 20px 32px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-family:-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;font-weight:700;font-size:22px">Nova lista</h2><button onClick="{{close}}" aria-label="Fechar" style="width:44px;height:44px;border:0;background:none;cursor:pointer;color:#2D1F1C"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<span style="font-size:13px;font-weight:600">Ocasião</span>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px"><sc-for list="{{occ}}" as="o" hint-placeholder-count="4"><button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="{{o.css}}">{{o.label}}</button></sc-for></div>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Data do evento<input type="text" value="20/02/2027" style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 14px;font:400 16px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif"></label>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">Endereço do link<input type="text" value="ana-e-pedro/cha-bar" style="height:50px;border-radius:14px;border:1.5px solid #CDB9B3;background:#FFFFFF;padding:0 14px;font:400 16px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif"></label>
<a href="ListaPresentes.dc.html" style="height:52px;border-radius:26px;background:#9A5A50;color:#FFFFFF;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none">Criar e escolher itens</a>
</div>
</div>
</sc-if>
<nav aria-label="Menu principal" style="display:flex;justify-content:space-around;padding:8px 6px 22px;background:#FFFFFF;border-top:1px solid #E6D8D3">
<a href="Inicio.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
<a href="Checklist.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="14" r="6"/><circle cx="15" cy="14" r="6"/><path d="M10 4h4l-2 3z" stroke-linejoin="round"/></svg>Casamento</a>
<a href="Casa.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z"/><path d="M5 18v2M19 18v2"/></svg>Casa</a>
<a href="Presentes.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:700;color:#9A5A50"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8C10 4 6 4 7 7c.5 1 2.5 1 5 1zm0 0c2-4 6-4 5-1-.5 1-2.5 1-5 1z"/></svg>Presentes</a>
<a href="Perfil.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;text-decoration:none;font-size:11px;font-weight:600;color:#6B5550"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { sheet: false, occ: 'Chá bar' }; }
renderVals() {
const lists = [
['Chá de panela', '12 de novembro de 2026', 'Publicada', 9, 24, 'Ver como convidado'],
['Casamento', '18 de abril de 2027', 'Publicada', 12, 46, 'Ver como convidado'],
['Chá bar', 'Sem data', 'Rascunho', 0, 8, 'Publicar link']
];
const css = (on) => 'min-height:46px;border-radius:14px;font:600 14px -apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;cursor:pointer;' + (on ? 'background:#9A5A50;color:#FFFFFF;border:1.5px solid #9A5A50' : 'background:#FFFFFF;color:#2D1F1C;border:1.5px solid #CDB9B3');
return {
lists: lists.map((l) => ({ name: l[0], date: l[1], status: l[2], cta: l[5], href: l[2] === 'Rascunho' ? 'ConfPublicarLista.dc.html' : 'SheetCompartilhar.dc.html', count: l[3] + ' de ' + l[4] + ' reservados',
pill: 'font-size:12px;font-weight:700;padding:4px 9px;border-radius:9px;' + (l[2] === 'Publicada' ? 'color:#2F6B4F;background:#DDEFE5' : 'color:#6B5550;background:#F1E6E2'),
bar: 'width:' + Math.round(l[3] / l[4] * 100) + '%;height:100%;border-radius:3px;background:#3E5A8A' })),
sheet: this.state.sheet, open: () => this.setState({ sheet: true }), close: () => this.setState({ sheet: false }),
occ: ['Chá de panela', 'Chá de cozinha', 'Chá bar', 'Casamento'].map((l) => ({ label: l, on: String(this.state.occ === l), css: css(this.state.occ === l), pick: () => this.setState({ occ: l }) }))
};
}
}
</script>
</body>
</html>
