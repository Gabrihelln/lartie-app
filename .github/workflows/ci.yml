name: CI

on:
  push:
    branches: [main, 'etapa-*']
  pull_request:

jobs:
  pacotes-e-regras:
    name: Pacotes e regras do Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes (tokens e regras de negócio)
        run: npm test
      - name: Regras de segurança do Firestore (emulador)
        run: npx --yes firebase-tools@15.18.0 emulators:exec --only firestore --project demo-lartie "npm run test:regras -w @lartie/firebase"

  app:
    name: App (tipos e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test -- --ci
