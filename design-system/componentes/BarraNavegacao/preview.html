<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><title>Barra de navegação</title>
<style>
body{margin:0;background:var(--background);color:var(--on-surface)}
.wrap{display:flex;flex-wrap:wrap;gap:24px;padding:20px}
.col{display:flex;flex-direction:column;gap:8px;width:390px}
.cap{font:600 13px/18px var(--font-ios);color:var(--on-surface-variant)}
.bar{display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--outline-variant)}
.ios{height:83px;padding-top:6px;box-sizing:border-box;align-items:flex-start}
.and{height:80px;align-items:center}
.t{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;color:var(--on-surface-variant)}
.ios .t{font:500 11px/13px var(--font-ios)}
.and .t{font:500 12px/16px var(--font-android);letter-spacing:0.5px}
.ios .on{color:var(--primary)}
.and .on{color:var(--on-surface)}
.pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.and .on .pill{background:var(--primary-container);color:var(--on-primary-container)}
svg{width:24px;height:24px}
</style></head>
<body>
<div class="wrap">
<div class="col"><span class="cap">iOS · tab bar</span>
<nav class="bar ios" aria-label="Menu principal">
<span class="t on"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</span>
<span class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="14" r="6"/><circle cx="15" cy="14" r="6"/></svg>Casamento</span>
<span class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z"/></svg>Casa</span>
<span class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13"/></svg>Presentes</span>
<span class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</span>
</nav></div>
<div class="col"><span class="cap">Android · Material 3</span>
<nav class="bar and" aria-label="Menu principal">
<span class="t on"><span class="pill"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>Início</span>
<span class="t"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="14" r="6"/><circle cx="15" cy="14" r="6"/></svg></span>Casamento</span>
<span class="t"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z"/></svg></span>Casa</span>
<span class="t"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13"/></svg></span>Presentes</span>
<span class="t"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>Perfil</span>
</nav></div>
</div>
</body></html>
