<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><title>Botão</title>
<style>
body{margin:0;background:var(--background);font-family:var(--font-ios)}
.wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:20px;max-width:560px}
.b{height:52px;border-radius:var(--radius-full);font:600 17px/22px var(--font-ios);letter-spacing:-0.43px;border:0;cursor:pointer}
.p{background:var(--primary);color:var(--on-primary)}
.t{background:var(--primary-container);color:var(--on-primary-container)}
.o{background:transparent;color:var(--on-surface);border:1.5px solid var(--outline)}
.x{background:transparent;color:var(--primary)}
.d{background:transparent;color:var(--error)}
.w{background:var(--whatsapp);color:#FFFFFF}
</style></head>
<body>
<div class="wrap">
<button class="b p">Continuar</button>
<button class="b t">Ver como convidado</button>
<button class="b o">Já tenho conta</button>
<button class="b x">Convidar depois</button>
<button class="b d">Excluir tarefa</button>
<button class="b w">Enviar pelo WhatsApp</button>
</div>
</body></html>
